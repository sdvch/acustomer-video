# acustomer-video 独立部署 nginx 配置
# 与短剧项目（storyboard-system）共用同一台服务器，但使用独立端口/域名，互不影响。
#
# 用法：
#   sudo cp nginx.conf /etc/nginx/conf.d/acustomer-video.conf
#   sudo nginx -t && sudo nginx -s reload
#
# HTTPS 证书用 certbot 签发：certbot --nginx -d api.acustomer-video.example.com

upstream acustomer_video_backend {
    server 127.0.0.1:18080;
    keepalive 32;
}

server {
    listen 80;
    # 生产环境替换为真实域名，并按上面注释开启 443/证书
    server_name api.acustomer-video.example.com;

    client_max_body_size 200m;          # 素材上传上限（本地降级模式 multipart 上传）
    proxy_read_timeout 300s;            # 合成相关接口等待
    proxy_send_timeout 300s;

    location /api/v1/assets/upload {
        proxy_pass http://acustomer_video_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;    # 大文件上传直通后端
    }

    location /api/ {
        proxy_pass http://acustomer_video_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
