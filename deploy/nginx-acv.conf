# acustomer-video 对外入口（片段，需手工并入 /etc/nginx/nginx.conf 的 80 default_server）
#
# 背景：阿里云安全组只放行 80/443，后端 18080 无法直接公网访问。
# 因此在现有 nginx（与 storyboard 共用进程）里按前缀暴露，避免新增端口与域名。
# 注意：不要改 /etc/nginx/conf.d/popreels.conf，那个文件由 storyboard 部署脚本覆盖。

# 1) API：http://<IP>/acv/v1/...  ->  http://127.0.0.1:18080/api/v1/...
location /acv/ {
    proxy_pass http://127.0.0.1:18080/api/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 30s;
    proxy_send_timeout 600s;   # 素材直传 / 长任务轮询
    proxy_read_timeout 600s;
    client_max_body_size 300m;
}

# 2) 本地存储文件：http://<IP>/storage/...  ->  http://127.0.0.1:18080/storage/...
#    仅 OSS 未配置（本地降级模式）时需要；配置 OSS 后可删除
location /storage/ {
    proxy_pass http://127.0.0.1:18080/storage/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    expires 1h;
}
